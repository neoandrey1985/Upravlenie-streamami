# Override for environments where Docker bridge networking between containers is broken
# (Cloud Agent VMs). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
#
# All services share the host network namespace and talk via 127.0.0.1.
# Postgres :5432, API :8080, analytics :8000, web :8090.

services:
  db:
    network_mode: host
    # Host-networked Postgres ignores published ports; listens on 5432 by default.

  api:
    network_mode: host
    environment:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/streams
    # Spring Boot default port 8080 on the host.

  analytics:
    network_mode: host
    environment:
      DB_URL_PY: postgresql+psycopg2://streams:${DB_PASSWORD:-streams}@127.0.0.1:5432/streams
    # Uvicorn listens on 8000 (see analytics Dockerfile CMD).

  web:
    network_mode: host
    # ports: ignored under network_mode:host — nginx.host.conf listens on 8090.
    volumes:
      - ./frontend/nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
